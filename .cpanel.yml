---
deployment:
  tasks:
    - export DEPLOYPATH=/home/ecasorke/public_html

    # 1. Clean old build assets & legacy physical folders that interfere with SPA routes
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/rm -rf $DEPLOYPATH/contact $DEPLOYPATH/gallery $DEPLOYPATH/msimamizi $DEPLOYPATH/msimamizi.ecasiafrica.org $DEPLOYPATH/contact.html $DEPLOYPATH/gallery.html $DEPLOYPATH/contact.php $DEPLOYPATH/gallery.php

    # 2. Deploy production build to shared Document Root (/home/ecasorke/public_html)
    #    Serves both https://ecasiafrica.org and https://msimamizi.ecasiafrica.org
    - /bin/cp -R dist/* $DEPLOYPATH/
    - /bin/cp dist/.htaccess $DEPLOYPATH/ 2>/dev/null || /bin/cp public/.htaccess $DEPLOYPATH/
